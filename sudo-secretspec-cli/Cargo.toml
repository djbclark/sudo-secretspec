[package]
name = "sudo-secretspec-cli"
version.workspace = true
edition.workspace = true
description = "sudo-secretspec drift-check and runtime validation"

[lib]
name = "sudo_secretspec_cli"
path = "src/lib.rs"

[[bin]]
name = "sudo-secretspec"
path = "src/main.rs"

[dependencies]
clap.workspace = true
rusqlite = { version = "0.31" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
secretspec = { path = "../secretspec", version = "0.19.1-sudo.14", default-features = false, features = ["manifest-edit", "codegen-schema"] }
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"