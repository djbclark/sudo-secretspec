name: sudo-secretspec downstream release checks

on:
  pull_request:
    paths:
      - "packaging/**"
      - "sudo-secretspec/**"
      - "skills/sudo-secretspec/**"
      - "tests/sudo_packaging/**"
      - "tests/sudo_secretspec/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sudo-release.yml"
      - "CHANGELOG.md"
  push:
    tags:
      - "v0.19.1-djbclark.1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.13"
      - name: Install focused test dependencies
        run: |
          python -m pip install pytest ruff
          brew install shellcheck shfmt
      - name: Test downstream companion and release helper
        run: |
          python -m ruff check sudo-secretspec packaging tests/sudo_secretspec tests/sudo_packaging
          python -m ruff format --check sudo-secretspec packaging tests/sudo_secretspec tests/sudo_packaging
          python -m pytest tests/sudo_secretspec tests/sudo_packaging -q
          shfmt -d -i 2 -ci sudo-secretspec/bin/install-sudo-secretspec sudo-secretspec/libexec/sudo-secretspec-broker
          shellcheck -S warning sudo-secretspec/bin/install-sudo-secretspec sudo-secretspec/libexec/sudo-secretspec-broker
      - name: Check formula style and syntax
        run: |
          ruby -c packaging/homebrew/sudo-secretspec.rb
          brew style packaging/homebrew/sudo-secretspec.rb
      - name: Verify pinned tag identity
        if: github.ref_type == 'tag'
        env:
          EXPECTED_TAG: v0.19.1-djbclark.1
        run: test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
